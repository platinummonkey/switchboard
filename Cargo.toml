[workspace]
members = [
    "crates/switchboard-server",
    "crates/switchboard-local",
    "crates/switchboard-common",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["platinummonkey"]
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP framework + middleware
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "timeout"] }

# HTTP client
reqwest = { version = "0.13", features = ["json", "stream", "rustls", "form"] }

# SSE
eventsource-stream = "0.2"

# gRPC
tonic = { version = "0.14", features = ["tls-ring"] }
prost = "0.14"

# AWS
aws-sigv4 = "1"
aws-credential-types = "1"
aws-sdk-sts = "1"
aws-config = "1"
aws-types = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
config = "0.15"
dotenvy = "0.15"
toml = "1.0"

# Tracing / observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = "0.31"

# TLS
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
pem-rfc7468 = { version = "0.7", features = ["alloc"] }
x509-parser = "0.18"
rcgen = "0.14"

# HTTP/2 + connection utilities
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }

# Auth / JWT
jsonwebtoken = "10"

# Error handling
thiserror = "2"
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Static assets (admin UI)
rust-embed = { version = "8", features = ["compression"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
bytes = "1"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
dashmap = "6"
arc-swap = "1"
rand = "0.9"
subtle = "2"
libc = "0.2"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "chrono", "migrate"] }

# Testing
wiremock = "0.6"
insta = { version = "1", features = ["json", "yaml"] }
proptest = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
