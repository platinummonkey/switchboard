# Podman Compose / Docker Compose for local Switchboard development.
#
# Usage:
#   cp .env.example .env          # fill in your API keys
#   podman compose up --build     # build images and start both services
#
# Tool access (once running):
#   Claude Code : ANTHROPIC_BASE_URL=http://localhost:8877/api
#   OpenAI compat: base URL http://localhost:8877/v1
#   Admin API   : http://localhost:9090/admin/api/v1/
#
# Env vars required (see .env.example):
#   SWITCHBOARD_API_KEY      shared secret between local and server
#   SWITCHBOARD_ADMIN_TOKEN  bearer token for the admin API
#   ANTHROPIC_API_KEY        upstream Anthropic key
#   OPENAI_API_KEY           upstream OpenAI key

name: switchboard

services:

  # ── postgres ─────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: switchboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: switchboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchboard -d switchboard"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ── switchboard-server ──────────────────────────────────────────────────────
  switchboard-server:
    build:
      context: .
      dockerfile: Containerfile
      target: server
    image: switchboard-server:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SWITCHBOARD_CONFIG: /etc/switchboard/server.toml
      SWITCHBOARD_API_KEY: ${SWITCHBOARD_API_KEY}
      SWITCHBOARD_ADMIN_TOKEN: ${SWITCHBOARD_ADMIN_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
      SWITCHBOARD__DATABASE__ENABLED: "true"
      SWITCHBOARD__DATABASE__WRITE_URL: "postgresql://switchboard:${POSTGRES_PASSWORD:-changeme}@postgres:5432/switchboard"
      SWITCHBOARD__DATABASE__AUTO_MIGRATE: "true"
    volumes:
      - ./deploy/server.toml:/etc/switchboard/server.toml:ro
    ports:
      - "8080:8080"   # proxy (direct access, bypass local)
      - "9090:9090"   # admin API + UI
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'Authorization: Bearer ${SWITCHBOARD_API_KEY}' http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── switchboard-local ───────────────────────────────────────────────────────
  switchboard-local:
    build:
      context: .
      dockerfile: Containerfile
      target: local
    image: switchboard-local:dev
    restart: unless-stopped
    depends_on:
      switchboard-server:
        condition: service_healthy
    environment:
      SWITCHBOARD_API_KEY: ${SWITCHBOARD_API_KEY}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      # Mounted as a template so the entrypoint can substitute env vars before start.
      - ./deploy/local.toml:/home/switchboard/.switchboard/config.toml.tmpl:ro
    ports:
      - "8877:8877"   # OpenAI/Anthropic-compat endpoint for local tools
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8877/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
